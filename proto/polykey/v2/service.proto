syntax = "proto3";

package polykey.v2;

import "google/protobuf/empty.proto";
import "polykey/v2/metrics.proto";
import "polykey/v2/auth.proto";
import "polykey/v2/single_operations.proto";
import "polykey/v2/batch_operations.proto"; 
import "polykey/v2/stream_operations.proto";


option go_package = "github.com/spounge-ai/spounge-proto/gen/go/polykey/v2;polykeyv2";

service PolykeyService {
  rpc HealthCheck(google.protobuf.Empty) returns (HealthCheckResponse);

  // 1-5, few nodes
  rpc GetKey(GetKeyRequest) returns (GetKeyResponse);
  rpc ListKeys(ListKeysRequest) returns (ListKeysResponse);
  rpc CreateKey(CreateKeyRequest) returns (CreateKeyResponse);
  rpc RotateKey(RotateKeyRequest) returns (RotateKeyResponse);
  rpc RevokeKey(RevokeKeyRequest) returns (google.protobuf.Empty);
  rpc UpdateKeyMetadata(UpdateKeyMetadataRequest) returns (google.protobuf.Empty);
  rpc GetKeyMetadata(GetKeyMetadataRequest) returns (GetKeyMetadataResponse);

 // Batch operations (5-50 keys)
  rpc BatchGetKeys(BatchGetKeysRequest) returns (BatchGetKeysResponse);
  rpc BatchCreateKeys(BatchCreateKeysRequest) returns (BatchCreateKeysResponse);
  rpc BatchRotateKeys(BatchRotateKeysRequest) returns (BatchRotateKeysResponse);
  rpc BatchRevokeKeys(BatchRevokeKeysRequest) returns (BatchRevokeKeysResponse);
  rpc BatchUpdateKeyMetadata(BatchUpdateKeyMetadataRequest) returns (BatchUpdateKeyMetadataResponse);
  rpc BatchGetKeyMetadata(BatchGetKeyMetadataRequest) returns (BatchGetKeyMetadataResponse);
  

  // Streaming operations (50+ keys) unlikely right now, but in-case
  rpc StreamGetKeys(StreamGetKeysRequest) returns (stream StreamGetKeysResponse);
  rpc StreamCreateKeys(stream StreamCreateKeysRequest) returns (stream StreamCreateKeysResponse);
  rpc StreamRotateKeys(stream StreamRotateKeysRequest) returns (stream StreamRotateKeysResponse);
  rpc StreamRevokeKeys(stream StreamRevokeKeysRequest) returns (stream StreamRevokeKeysResponse);
  rpc StreamUpdateKeyMetadata(stream StreamUpdateKeyMetadataRequest) returns (stream StreamUpdateKeyMetadataResponse);
  rpc StreamGetKeyMetadata(stream StreamGetKeyMetadataRequest) returns (stream StreamGetKeyMetadataResponse);
  
  rpc Authenticate(AuthenticateRequest) returns (AuthenticateResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc RevokeToken(RevokeTokenRequest) returns (RevokeTokenResponse);  
}
 